schema_version: 1
registry_id: PX00-REPO-PROTECT-0001
status: ACTIVE
repository: VictorKVS/PX00
purpose: >-
  Protect canonical FATHER/PX00 runtime, governance, history and Factory Builder surfaces from
  accidental deletion, rename, merge or relocation during repository restructuring.

semantics:
  content_edits_allowed: true
  structural_reorganization_rule: >-
    Protected paths may evolve in content, but their repository identity/path must not be changed
    as part of generic cleanup or restructuring. Any relocation requires an explicit migration
    record, old-to-new mapping, reference update plan, replay/provenance impact review and green CI.
  protection_classes:
    DO_NOT_MOVE: >-
      Canonical identity/history surface. Do not rename, relocate, merge into another tree or
      delete during repository restructuring. Replacement requires explicit owner decision and ADR.
    MIGRATION_ONLY: >-
      May be structurally moved only through an explicit repository migration record with old/new
      paths, affected contracts, compatibility plan, rollback plan and CI evidence.
    CAN_REORGANIZE: >-
      Not structurally protected by this registry; ordinary repository cleanup rules apply.

protected_surfaces:
  - id: PX00-PROT-001
    path: PX00.yaml
    kind: file
    class: DO_NOT_MOVE
    owner: PX00_CORE
    reason: root canonical PX00 contract and repository identity
  - id: PX00-PROT-002
    path: governance/FATHER_CONSTITUTION.md
    kind: file
    class: DO_NOT_MOVE
    owner: FATHER_GOVERNANCE
    reason: constitutional invariants and authority model
  - id: PX00-PROT-003
    path: governance/DECISION_MATERIALITY_STANDARD.md
    kind: file
    class: DO_NOT_MOVE
    owner: FATHER_GOVERNANCE
    reason: project-wide D0-D3 assurance norm PX00-NORM-DM-0001
  - id: PX00-PROT-004
    path: governance/ARCHITECT_FORESIGHT_LOOP.md
    kind: file
    class: DO_NOT_MOVE
    owner: FATHER_GOVERNANCE
    reason: long-lived architecture foresight control
  - id: PX00-PROT-005
    path: governance/REPOSITORY_STRUCTURE_PROTECTION.yaml
    kind: file
    class: DO_NOT_MOVE
    owner: REPOSITORY_GOVERNANCE
    reason: self-protecting structural registry
  - id: PX00-PROT-006
    path: Tree_F
    kind: directory
    class: DO_NOT_MOVE
    owner: STRUCTURE_HISTORY
    reason: append-only implementation generation history
  - id: PX00-PROT-007
    path: journal
    kind: directory
    class: DO_NOT_MOVE
    owner: DEVELOPMENT_HISTORY
    reason: root development journal records
  - id: PX00-PROT-008
    path: DEVELOPMENT_JOURNAL.md
