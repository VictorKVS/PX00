    reason: architecture decision history and stable ADR references
  - id: PX00-PROT-010
    path: PROJECT_PROGRESS.md
    kind: file
    class: DO_NOT_MOVE
    owner: FATHER_PROGRAM_CONTROL
    reason: canonical human-readable summit/progress control surface
  - id: PX00-PROT-011
    path: projects/FATHER_FACTORY_BUILDER
    kind: directory
    class: DO_NOT_MOVE
    owner: PROJECT-FFB-0001
    reason: canonical Factory Builder project root including roles, contracts, risks and journals
  - id: PX00-PROT-012
