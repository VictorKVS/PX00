explicitly_reorganizable_roots:
  - path: legacy
    note: legacy content may be reorganized only after checking that no protected reference targets it

migration_requirements:
  required_record_path_prefix: governance/repository-migrations/
  required_fields:
    - migration_id
    - rationale
    - affected_protected_surface_ids
    - old_to_new_path_map
    - inbound_reference_inventory
    - historical_trace_or_replay_impact
    - compatibility_or_redirect_plan
    - rollback_plan
    - reviewer
    - ci_evidence
  rules:
    - generic_cleanup_is_not_a_migration_record
    - protected_history_must_not_be_squashed_or_rewritten
    - cross_repository_references_must_be_updated_atomically_or_versioned_compatibly
    - canonical_owner_boundary_between_PX00_and_KNOWLEDGE_CORE_must_be_preserved
