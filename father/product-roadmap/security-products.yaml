schema_version: "1.0"
route_id: "ROADMAP-SECURITY-ROUTE-0001"
status: "ROUTE_ONLY"
canonical_repository: "VictorKVS/KNOWLEDGE_CORE"
canonical_path: "father/product-roadmap/security-products.yaml"
canonical_product_tree: "security-knowledge/"
logical_product_ref: "SEC-PROD-0001"
logical_knowledge_space_ref: "KB-SECURITY"

purpose: >-
  PX00/FATHER consumes the canonical Security product roadmap from KNOWLEDGE_CORE.
  This file is intentionally not a second copy of product truth.

runtime_boundary:
  father_may:
    - "resolve the canonical roadmap and product state"
    - "request governed Security Knowledge context"
    - "start projects/tasks against declared product gates"
    - "record runtime evidence, review and acceptance in PX00"
  father_must_not:
    - "silently rewrite canonical Security Knowledge facts"
    - "promote downstream security products by changing this route file"
    - "treat retrieval/model output as VERIFIED knowledge"
    - "treat live-provider readiness as a prerequisite for corpus population"

parallelism:
  live_provider_summit: "ALLOWED_IN_PARALLEL"
  security_knowledge_blocked_by_live_provider: false

integrity_rule: >-
  Product maturity and expert-readiness decisions are read from the canonical KNOWLEDGE_CORE product state;
  PX00 supplies orchestration/assurance evidence but does not create a competing source of truth.
