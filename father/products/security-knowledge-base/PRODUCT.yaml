schema_version: "1.0"
product_id: "SEC-PROD-0001"
name: "Security Knowledge Base"
status: "ACTIVE_BUILD"
portfolio_track: "TRACK-SECURITY"
roadmap_ref: "father/product-roadmap/security-products.yaml"
product_owner: "PX00/FATHER"
factory_builder_ref: "PROJECT-FFB-0001"
logical_knowledge_space_ref: "KB-SECURITY"

mission: >-
  Build an evidence-based, versioned, reviewable security knowledge foundation from admitted
  sources, explicit evidence and assessed claims so later security products can reason from
  traceable knowledge rather than model memory or ungoverned summaries.

non_goals:
  - "Do not treat retrieval output as evidence automatically."
  - "Do not treat LLM-generated text as an authoritative source."
  - "Do not hide conflicting interpretations."
  - "Do not optimize for corpus size without coverage and quality evidence."
  - "Do not promote downstream products to authoritative maturity before the expert-readiness gate passes."

canonical_pipeline:
  - "SOURCE_ADMISSION"
  - "SOURCE_ASSESSMENT"
  - "EVIDENCE_EXTRACTION"
  - "EVIDENCE_ASSESSMENT"
  - "CLAIM_CREATION"
  - "CLAIM_ASSESSMENT"
  - "REQUIREMENT_OR_CONTROL_MAPPING"
  - "DOMAIN_COVERAGE_UPDATE"
  - "INDEPENDENT_REVIEW"
  - "KNOWLEDGE_ADMISSION"
  - "FRESHNESS_AND_CHANGE_MONITORING"

quality_dimensions:
  - "provenance"
  - "authority"
  - "version_identity"
  - "effective_date_or_temporal_scope"
  - "source_independence"
  - "evidence_directness"
  - "coverage"
  - "freshness"
  - "conflict_visibility"
  - "reproducibility"
  - "expert_benchmark_performance"

hard_dependencies:
  - "SOURCE/EVIDENCE/CLAIM provenance contracts"
  - "immutable knowledge object versioning"
  - "claim/evidence quality assessment"
  - "challenge/review/supersession lineage"
  - "downstream staleness propagation"
  - "Socrates and ARGUS independent review"

exit_gate_ref: "SEC-GATE-EXPERT-KNOWLEDGE-0001"

maturity_sequence:
  - stage: "SKB-M0_SCOPE"
    proves: "Declared domains, jurisdictions, source classes and benchmark plan exist."
  - stage: "SKB-M1_SEED"
    proves: "A small representative source/evidence/claim set traverses the governed pipeline."
  - stage: "SKB-M2_COVERAGE"
    proves: "Coverage is measurable and major gaps are explicit."
  - stage: "SKB-M3_EXPERT_REVIEW"
    proves: "Independent expert benchmark and contradiction handling are demonstrated."
  - stage: "SKB-M4_EXPERT_READY"
    proves: "Declared scope passes SEC-GATE-EXPERT-KNOWLEDGE-0001."

current_stage: "SKB-M0_SCOPE"
next_target: "Build measurable coverage model and first governed seed slice without claiming broad expert coverage."
