schema_version: "1.0"
route_id: "SEC-PROD-0001-ROUTE"
product_id: "SEC-PROD-0001"
name: "Security Knowledge Base"
status: "EXTERNAL_CANONICAL_PRODUCT"
canonical_repository: "VictorKVS/KNOWLEDGE_CORE"
canonical_product_tree: "security-knowledge/"
canonical_roadmap: "father/product-roadmap/security-products.yaml"
canonical_domain_registry: "father/domain-knowledge/domain-registry.yaml"
logical_knowledge_space_ref: "KB-SECURITY"

father_role: >-
  PX00/FATHER orchestrates work that consumes or advances Security Knowledge, but the canonical
  source/version/requirement/applicability/control/check/evidence graph and expert-readiness state
  are owned by KNOWLEDGE_CORE.

canonical_pipeline: >-
  SOURCE -> VERSION -> CHUNK -> ATOMIC CLAIM/REQUIREMENT -> APPLICABILITY -> RELATIONS -> CONTROL -> CHECK -> EVIDENCE -> EXPERT REVIEW

verified_rule: >-
  VERIFIED requires an admitted primary source and exact locator. Retrieval/model output is not authoritative knowledge.

parallel_rule: >-
  SUMMIT-FFB-02 live-provider development may continue in parallel and does not block Security Knowledge corpus work.

anti_duplication_rule: >-
  Do not create a second Security Knowledge corpus, coverage model, expert-readiness truth or source backlog in PX00.
  Runtime-specific integrations must reference/pin canonical KNOWLEDGE_CORE objects instead.
