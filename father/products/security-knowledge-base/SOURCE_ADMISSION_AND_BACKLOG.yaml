schema_version: "1.0"
plan_id: "SKB-SOURCE-PLAN-0001"
product_ref: "SEC-PROD-0001"
status: "ACTIVE"

source_first_rule: >-
  Build the authoritative layer from primary and official sources first. Create graph nodes,
  control mappings, attack/test mappings and expert synthesis only after the underlying source,
  evidence and claim lineage exists.

admission_priority:
  - tier: "T0_PRIMARY_NORMATIVE"
    priority: 1
    source_classes:
      - "law_or_statute"
      - "government_regulation_or_decree"
      - "regulator_order_or_mandatory_requirement"
      - "officially_published_normative_document"
    intended_use: "Normative obligations, applicability, effective dates and legal/regulatory requirements."
  - tier: "T1_OFFICIAL_METHOD"
    priority: 2
    source_classes:
      - "regulator_methodology"
      - "official_guidance"
      - "official_registry_or_catalog"
      - "official_security_advisory"
    intended_use: "Authoritative implementation/assessment context where the source is competent for the topic."
  - tier: "T2_STANDARD"
    priority: 3
    source_classes:
      - "national_standard"
      - "international_standard"
      - "industry_standard"
      - "consensus_control_framework"
    intended_use: "Control structures, engineering practice, terminology and assurance methods."
  - tier: "T3_PRIMARY_TECHNICAL"
    priority: 4
    source_classes:
      - "official_vendor_documentation"
      - "official_protocol_or_product_security_documentation"
      - "upstream_project_documentation"
      - "primary_research_or_specification"
    intended_use: "Technical behavior, configuration, vulnerabilities, product/protocol semantics."
  - tier: "T4_SECONDARY_EXPERT"
    priority: 5
    source_classes:
      - "peer_reviewed_analysis"
      - "recognized_expert_analysis"
      - "training_material"
      - "technical_article"
    intended_use: "Interpretation, examples and secondary explanation; never silently promoted above primary sources."

mandatory_metadata_per_source:
  - "stable source_id"
  - "publisher/authority identity"
  - "title"
  - "source class/tier"
  - "jurisdiction or technical scope"
  - "version/publication identity when available"
  - "publication/effective/retirement dates when applicable"
  - "retrieval or acquisition provenance"
  - "content digest/version identity"
  - "supersession relationship when known"
  - "source quality assessment"

admission_rules:
  - "A URL alone is not an admitted source object."
  - "A summary is not a substitute for the primary source it summarizes."
  - "LLM-generated text is interpretation, not source evidence."
  - "Normative force and technical usefulness are separate dimensions."
  - "If applicability, version or effective date is uncertain, record UNKNOWN/TBD instead of guessing."
  - "Conflicting primary/official sources create a reviewable conflict; they are not silently reconciled."
  - "Physical storage location may change; stable source identity and content/version lineage must not."

build_order:
  - step: 1
    name: "SOURCE INVENTORY"
    outcome: "Known authoritative source families and gaps are registered."
  - step: 2
    name: "SOURCE ADMISSION"
    outcome: "Selected source versions are immutable and provenance-bound."
  - step: 3
    name: "EVIDENCE EXTRACTION"
    outcome: "Atomic evidence items preserve source location/context."
  - step: 4
    name: "CLAIM FORMATION"
    outcome: "Claims are explicit statements derived from evidence, not hidden model conclusions."
  - step: 5
    name: "ASSESSMENT AND CONFLICT"
    outcome: "Support, contradiction, confidence dimensions and source independence are evaluated."
  - step: 6
    name: "REQUIREMENT/CONTROL GRAPH"
    outcome: "Governed nodes/edges link obligations, controls, assets, threats and verification methods."
  - step: 7
    name: "ATTACK/TEST MAPPING"
    outcome: "Pentest/assurance rules and technique mappings are linked only to reviewed technical/normative basis."
  - step: 8
    name: "EXPERT BENCHMARK"
    outcome: "The resulting knowledge snapshot is tested on evidence-backed expert questions."

initial_backlog:
  - backlog_id: "SKB-BL-0001"
    title: "Define first jurisdiction/security profile"
    status: "TBD"
    rule: "Do not bulk-ingest jurisdiction-specific normative sources until target profile is explicit."
  - backlog_id: "SKB-BL-0002"
    title: "Build primary normative source inventory"
    status: "READY_AFTER_PROFILE"
  - backlog_id: "SKB-BL-0003"
    title: "Build regulator methodology and official guidance inventory"
    status: "READY_AFTER_PROFILE"
  - backlog_id: "SKB-BL-0004"
    title: "Build standards/control framework inventory"
    status: "PLANNED"
  - backlog_id: "SKB-BL-0005"
    title: "Prove first governed source-to-claim slice"
    status: "PLANNED"
  - backlog_id: "SKB-BL-0006"
    title: "Link reviewed claims to control/requirement graph"
    status: "BLOCKED_BY_SKB-BL-0005"
  - backlog_id: "SKB-BL-0007"
    title: "Link reviewed control graph to approved attack/test mappings"
    status: "BLOCKED_BY_SKB-BL-0006"
  - backlog_id: "SKB-BL-0008"
    title: "Create expert benchmark v1"
    status: "PLANNED"
