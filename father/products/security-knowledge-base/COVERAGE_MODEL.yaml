schema_version: "1.0"
coverage_model_id: "SKB-COVERAGE-0001"
product_ref: "SEC-PROD-0001"
status: "ACTIVE"

principle: >-
  Coverage is measured against declared cells, not against document count, embedding count,
  token count or search recall alone. Empty or uncertain cells remain visible.

coverage_axes:
  security_domains:
    - "SECURITY_GOVERNANCE"
    - "ASSET_AND_CONFIGURATION_MANAGEMENT"
    - "IDENTITY_AND_ACCESS_MANAGEMENT"
    - "NETWORK_AND_COMMUNICATION_SECURITY"
    - "ENDPOINT_AND_PLATFORM_SECURITY"
    - "APPLICATION_AND_SOFTWARE_SECURITY"
    - "DATA_PROTECTION_AND_PRIVACY"
    - "CRYPTOGRAPHY_AND_KEY_MANAGEMENT"
    - "LOGGING_MONITORING_AND_DETECTION"
    - "INCIDENT_RESPONSE_AND_FORENSICS"
    - "VULNERABILITY_AND_EXPOSURE_MANAGEMENT"
    - "RISK_AND_COMPLIANCE"
    - "BACKUP_RESILIENCE_AND_RECOVERY"
    - "CLOUD_AND_VIRTUALIZATION_SECURITY"
    - "SUPPLY_CHAIN_AND_THIRD_PARTY_SECURITY"
    - "AI_AND_AGENT_SECURITY"
    - "PHYSICAL_AND_CYBER_PHYSICAL_SECURITY"
  knowledge_classes:
    - "NORMATIVE_REQUIREMENT"
    - "OFFICIAL_GUIDANCE_OR_METHODOLOGY"
    - "CONTROL_OR_SAFEGUARD"
    - "THREAT_OR_ATTACK_TECHNIQUE"
    - "VULNERABILITY_OR_WEAKNESS"
    - "ARCHITECTURE_PATTERN"
    - "IMPLEMENTATION_PATTERN"
    - "TEST_OR_VERIFICATION_METHOD"
    - "INCIDENT_OR_FAILURE_LESSON"
    - "EXPERT_INTERPRETATION"
  lifecycle_contexts:
    - "DESIGN"
    - "BUILD"
    - "DEPLOY"
    - "OPERATE"
    - "MONITOR"
    - "RESPOND"
    - "RECOVER"
    - "RETIRE"
  jurisdiction_or_profile:
    - "GLOBAL_TECHNICAL"
    - "JURISDICTION_SPECIFIC_TBD"
    - "INDUSTRY_SPECIFIC_TBD"

cell_statuses:
  - "UNSCOPED"
  - "EMPTY"
  - "SEEDED"
  - "EVIDENCE_BACKED"
  - "INDEPENDENTLY_REVIEWED"
  - "EXPERT_READY"
  - "STALE_OR_REASSESSMENT_REQUIRED"

criticality_levels:
  - "FOUNDATIONAL"
  - "IMPORTANT"
  - "SUPPORTING"

initial_domain_register:
  - domain: "SECURITY_GOVERNANCE"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "IDENTITY_AND_ACCESS_MANAGEMENT"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "NETWORK_AND_COMMUNICATION_SECURITY"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "APPLICATION_AND_SOFTWARE_SECURITY"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "DATA_PROTECTION_AND_PRIVACY"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "LOGGING_MONITORING_AND_DETECTION"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "INCIDENT_RESPONSE_AND_FORENSICS"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "VULNERABILITY_AND_EXPOSURE_MANAGEMENT"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "RISK_AND_COMPLIANCE"
    criticality: "FOUNDATIONAL"
    status: "EMPTY"
  - domain: "BACKUP_RESILIENCE_AND_RECOVERY"
    criticality: "IMPORTANT"
    status: "EMPTY"
  - domain: "CLOUD_AND_VIRTUALIZATION_SECURITY"
    criticality: "IMPORTANT"
    status: "EMPTY"
  - domain: "SUPPLY_CHAIN_AND_THIRD_PARTY_SECURITY"
    criticality: "IMPORTANT"
    status: "EMPTY"
  - domain: "AI_AND_AGENT_SECURITY"
    criticality: "IMPORTANT"
    status: "EMPTY"
  - domain: "PHYSICAL_AND_CYBER_PHYSICAL_SECURITY"
    criticality: "SUPPORTING"
    status: "UNSCOPED"

measurement_rules:
  - "A cell cannot be EXPERT_READY solely because many documents mention the topic."
  - "EVIDENCE_BACKED requires admitted source/evidence/claim lineage."
  - "INDEPENDENTLY_REVIEWED requires reviewer independence from the producer assignment."
  - "Stale source or material supersession can downgrade a previously ready cell."
  - "Unknown jurisdiction or industry scope remains TBD rather than guessed."
  - "Coverage reports must expose both covered and uncovered cells."

first_seed_slice:
  objective: >-
    Prove the pipeline on a small cross-cutting security slice before bulk ingestion.
  candidate_scope:
    - "SECURITY_GOVERNANCE"
    - "IDENTITY_AND_ACCESS_MANAGEMENT"
    - "LOGGING_MONITORING_AND_DETECTION"
  status: "PLANNED"
