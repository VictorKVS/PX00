schema_version: "1.0"
gate_id: "SEC-GATE-EXPERT-KNOWLEDGE-0001"
product_ref: "SEC-PROD-0001"
status: "BLOCKING"
gate_type: "PRODUCT_FOUNDATION"

purpose: >-
  Prevent downstream security products from claiming authoritative maturity until the
  declared Security Knowledge scope has evidence-backed coverage, freshness, review and
  benchmark proof.

blocking_downstream_products:
  - "SEC-PROD-0002"
  - "SEC-PROD-0003"
  - "SEC-PROD-0004"
  - "SEC-PROD-0005"
  - "SEC-PROD-0006"
  - "SEC-PROD-0007"

required_evidence:
  scope_and_coverage:
    - "Declared security-domain coverage matrix exists."
    - "Jurisdiction/industry scope is explicit and unknown scope remains TBD."
    - "All foundational cells in declared scope are at least INDEPENDENTLY_REVIEWED."
    - "Known empty, stale and disputed cells are reported, not hidden."
  provenance_and_quality:
    - "Material claims resolve to admitted sources and evidence."
    - "Source and evidence quality assessments exist for material claims."
    - "Source version/effective-date or temporal scope is pinned when applicable."
    - "Generated interpretation is distinguishable from normative/factual source content."
    - "Conflicts and supersession are represented through immutable assessment lineage."
  change_and_freshness:
    - "Freshness policy exists per source class."
    - "Material source change can trigger downstream staleness and reassessment."
    - "Superseded source versions remain historically reproducible."
  benchmark:
    - "Representative expert benchmark set is versioned."
    - "Each benchmark answer requires evidence references, not only final text."
    - "Benchmark includes ambiguous/conflicting-source cases and refusal/unknown cases."
    - "Benchmark includes negative tests for hallucinated authority and stale knowledge."
    - "Benchmark results are reproducible for the evaluated knowledge snapshot."
  independent_assurance:
    - "Socrates challenge completed on the declared scope."
    - "ARGUS review completed for knowledge integrity and product-readiness claim."
    - "No unresolved S4 affects source admission, provenance, versioning or benchmark integrity."

forbidden_pass_conditions:
  - "Document count target reached."
  - "Vector search looks accurate in a demo."
  - "A model answers benchmark questions from memory without cited admitted evidence."
  - "One reviewer declares the corpus expert-grade without independent assurance."
  - "Downstream product pressure requests an exception to missing foundational evidence."

allowed_parallel_work:
  - "Isolated downstream PoC work that cannot become authoritative or production-promoted."
  - "Platform work that directly enables this gate."
  - "Critical risk remediation."

gate_decision_values:
  - "PASS"
  - "PASS_WITH_RESTRICTIONS"
  - "HOLD"
  - "FAIL"

current_decision: "HOLD"
current_reason: "Security Knowledge product is at SKB-M0_SCOPE; evidence-backed coverage and expert benchmark do not yet exist."
next_gate: "Prove SKB-M1_SEED on a small representative source/evidence/claim slice."
