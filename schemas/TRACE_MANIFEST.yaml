schema_version: 0.3
status: draft
object_type: TRACE
purpose: compact manifest linking governed execution events, material lineage, pinned knowledge context and evidence-backed professional decisions

required_fields:
  trace_id:
    type: TRACE-reference
  task_id:
    type: TASK-reference
  run_id:
    type: RUN-reference
  started_at:
    type: utc_timestamp
  status:
    type: enum
    values: [OPEN, SUCCEEDED, FAILED, CANCELLED, ESCALATED]
  event_refs:
    type: EVT-reference-list
    rule: ordered material events
  event_count:
    type: integer
    minimum: 0
  event_hashes:
    type: list
    item_type: sha256_hex
    rule: ordered one-to-one with event_refs
  integrity_algorithm:
    type: enum
    values: [sha256_chain_v1]
  chain_head_hash:
    type: sha256_hex_or_null
    rule: null only when event_count is zero

conditional_fields:
  project_id:
    type: PRJ-reference
    required_when: trace belongs to a governed project
  ended_at:
    type: utc_timestamp
    required_when: status is not OPEN
  parent_trace_id:
    type: TRACE-reference
    required_when: trace is a governed child/subprocess
  input_refs:
    type: canonical_reference_list
  output_refs:
    type: canonical_reference_list
  authority_decision_refs:
    type: canonical_reference_list
  policy_snapshot_refs:
    type: canonical_reference_list
  action_request_refs:
    type: ACTREQ-reference-list
  capability_grant_refs:
    type: canonical_reference_list
  evaluation_refs:
    type: EVAL-reference-list
  context_package_ref:
    type: CONTEXT_PACKAGE_reference
    required_when: RUN consumed governed knowledge context
  context_package_hash:
    type: sha256_hex
    required_when: context_package_ref is present
  knowledge_snapshot_refs:
    type: KNOWLEDGE_SNAPSHOT_reference_list
  knowledge_snapshot_digests:
    type: sha256_hex_list
    rule: ordered one-to-one with knowledge_snapshot_refs
  producer_manifest_refs:
    type: canonical_reference_list
  producer_manifest_digests:
    type: sha256_hex_list
    rule: ordered one-to-one with producer_manifest_refs
  decision_refs:
    type: PROFESSIONAL_DECISION_reference_list
    required_when: RUN makes or relies on a governed material professional decision
  decision_digests:
    type: sha256_hex_list
    rule: ordered one-to-one with decision_refs
  decision_materiality_classes:
    type: list
    item_values: [D0_LOCAL_CONVENTIONAL, D1_IMPLEMENTATION, D2_ARCHITECTURE_PRODUCT, D3_REGULATED_SAFETY_CRITICAL]
    rule: ordered one-to-one with decision_refs
  failure_ref:
    type: canonical_reference
    required_when: status is FAILED
  supersedes_trace:
    type: TRACE-reference
    required_when: a new governed trace replaces a prior attempt semantically

invariants:
  - trace_id_is_immutable
  - retries_do_not_overwrite_prior_trace_or_run_history
  - event_references_preserve_material_sequence
  - event_refs_and_event_hashes_have_equal_length_equal_to_event_count
  - event_hash_chain_detects_deletion_insertion_reordering_or_payload_tampering
  - chain_head_hash_matches_last_verified_event_hash
  - successful_status_does_not_erase_prior_failures
  - trace_manifest_contains_references_not_unnecessary_sensitive_payloads
  - knowledge_bound_trace_pins_context_package_ref_and_hash
  - knowledge_snapshot_refs_and_digests_have_equal_length
  - producer_manifest_refs_and_digests_have_equal_length
  - replay_of_knowledge_bound_trace_requires_expected_knowledge_context
  - knowledge_context_mismatch_fails_replay_closed
  - knowledge_provenance_does_not_grant_action_authority
  - material_decision_trace_pins_decision_ref_digest_and_materiality_class
  - decision_refs_digests_and_materiality_classes_have_equal_length
  - persisted_decision_context_cannot_be_silently_omitted_during_replay
  - decision_context_mismatch_fails_replay_closed
  - decision_digest_preserves_historical_rationale_references_without_exposing_hidden_chain_of_thought
  - decision_evidence_does_not_grant_action_authority

runtime_validator: deterministic_reference_implementation
library_dependency: none
