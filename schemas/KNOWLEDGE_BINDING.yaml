schema_version: 0.2
status: draft
object_type: knowledge_binding
purpose: bind PX00 roles/protocols to stable governed knowledge spaces resolved outside PX00

required_fields:
  binding_id:
    type: stable_id
  role_ref:
    type: ROLE_reference
  knowledge_space_id:
    type: stable_id
  logical_domain:
    type: string
  access_mode:
    type: enum
    values: [READ, QUERY, PROPOSE]
  purpose:
    type: string
  protocol_refs:
    type: protocol_reference_list

optional_fields:
  object_type_allowlist:
    type: string_list
  classification_ceiling:
    type: classification_label
  route_constraint_ref:
    type: knowledge_route_reference
  freshness_policy_ref:
    type: policy_reference

invariants:
  - binding_does_not_copy_knowledge_into_px00
  - binding_does_not_grant_tool_authority_by_itself
  - role_uses_knowledge_only_for_declared_purpose
  - protocol_context_constrains_binding_use
  - knowledge_space_identity_is_stable_and_independent_of_physical_repository
  - physical_repository_or_path_is_resolved_via_knowledge_route
  - write_or_admission_requires_separate_governed_action

reference_knowledge_spaces:
  - KB-PROGRAMMING
  - KB-SECURITY
  - KB-ARCHITECTURE
  - KB-DEVSECOPS
  - KB-PRODUCT
  - KB-RESEARCH
  - KB-OSINT
  - KB-AI-AGENTS

library_dependency: none
