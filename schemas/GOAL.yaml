schema_version: 0.1
status: draft
object_type: goal
purpose: represent a user or organizational objective before decomposition into governed work

required_fields:
  goal_id: {type: stable_id}
  owner_ref: {type: actor_reference}
  statement: {type: text}
  desired_outcomes: {type: list}
  constraints: {type: list}
  acceptance_criteria_refs: {type: list}
  priority: {type: enum, values: [LOW, NORMAL, HIGH, CRITICAL]}
  created_at: {type: utc_timestamp}
  state: {type: enum, values: [PROPOSED, ACTIVE, PAUSED, SATISFIED, ABANDONED]}

invariants:
  - goal_is_not_an_executable_instruction
  - decomposition_precedes_material_execution
  - acceptance_criteria_are_declared_before_goal_satisfaction
  - goal_history_is_not_rewritten
  - authority_is_not_inferred_from_goal_ownership

non_goals:
  - select_agent_or_model
  - grant_tool_authority
  - embed_domain_knowledge

library_dependency: none
