schema_version: 0.1
status: draft
object_type: EVT
purpose: canonical envelope for material PX00 events

required_fields:
  event_id:
    type: EVT-reference
    rule: immutable and never reused
  timestamp_utc:
    type: utc_timestamp
  significance:
    type: enum
    values: [T0, T1, T2, T3, T4, T5]
  trace_id:
    type: TRACE-reference
  run_id:
    type: RUN-reference
  task_id:
    type: TASK-reference
  actor_id:
    type: canonical_identity_reference
  action_type:
    type: string
  object_ref:
    type: canonical_reference
  result:
    type: string
  classification:
    type: classification_label
  retention_class:
    type: string

conditional_fields:
  role_id:
    type: ROLE-reference
    required_when: actor operates under a governed role
  role_version:
    type: string
    required_when: role_id is present
  protocol_id:
    type: PROTO-reference
    required_when: action is protocol-governed
  protocol_version:
    type: string
    required_when: protocol_id is present
  authority_decision_ref:
    type: canonical_reference
    required_when: event records a material tool/action execution
  project_id:
    type: PRJ-reference
    required_when: action belongs to a governed project
  input_refs:
    type: canonical_reference_list
  output_refs:
    type: canonical_reference_list
  evidence_refs:
    type: EVD-reference-list
  knowledge_refs:
    type: KN-reference-list
  rationale_summary:
    type: string
    required_when: event carries a material decision or evaluation
  reason_code:
    type: string
  provider_model_ref:
    type: string
    required_when: materially relevant to reproducibility/evaluation
  tool_ref:
    type: string
    required_when: external/internal tool executed materially
  provenance_parents:
    type: canonical_reference_list
  provenance_children:
    type: canonical_reference_list
  artifact_hashes:
    type: hash_reference_list
    required_when: integrity of an artifact is material

invariants:
  - every_material_event_has_trace_run_and_task_context
  - independent_observations_are_not_collapsed_by_equal_payload
  - hidden_chain_of_thought_is_not_required
  - rationale_is_explicit_summary_not_private_reasoning_dump
  - secrets_and_unnecessary_protected_values_are_not_logged
  - material_tool_actions_reference_authority_decision
  - failed_and_retried_runs_remain_distinguishable
  - display_brand_changes_do_not_change_canonical_lineage

runtime_validator: not_selected
library_dependency: none
