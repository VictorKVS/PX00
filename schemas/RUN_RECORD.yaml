schema_version: 0.5
status: draft
purpose: execution-instance contract for one bounded governed RUN

identity:
  run_id: RUN-XXXX
  task_id: TASK-XXXX
  trace_id: TRACE-XXXX
  protocol_id: PROTO-XXXX
  protocol_version: 0.1.0
  role_id: ROLE-XXXX
  role_version: 0.1.0

staffing:
  responsibility_ref: RESP-XXXX
  assignment_ref: ASSIGN-XXXX
  agent_id: AGENT-XXXX
  executor_type: null
  model_ref: null
  context_package_ref: CTX-XXXX
  context_package_hash: null
  context_hash_algorithm: sha256

knowledge_provenance:
  knowledge_snapshot_refs: []
  knowledge_snapshot_digests: []
  producer_manifest_refs: []
  producer_manifest_digests: []

policy:
  policy_snapshot_ref: POLSNAP-XXXX
  policy_snapshot_hash: null
  hash_algorithm: sha256

execution:
  started_at: null
  ended_at: null
  state: null
  attempt: 1
  parent_run_id: null
  retry_of: null
  current_step: null
  completed_steps: []

inputs:
  material_object_ids: []

outputs:
  material_object_ids: []

authority:
  decision_ids: []
  approval_ids: []

traceability:
  material_event_ids: []
  evidence_ids: []
  decision_ids: []
  evaluation_ids: []
  trace_manifest_ref: null
  trace_manifest_hash: null
  trace_manifest_hash_algorithm: sha256

failure:
  failure_class: null
  failure_reference: null
  escalation_reference: null

security:
  classification: null
  retention_class: null
  secret_values_embedded: false

invariants:
  - run_is_bounded
  - responsibility_role_must_match_run_role
  - assignment_role_must_match_run_role
  - assignment_must_be_active_when_run_starts
  - assignment_model_ref_is_pinned_for_run
  - replacing_assignment_or_model_does_not_rewrite_active_or_historical_run
  - context_package_run_role_and_assignment_must_match_run_record
  - context_package_hash_is_pinned_for_run
  - knowledge_snapshot_refs_and_digests_have_equal_length
  - producer_manifest_refs_and_digests_have_equal_length
  - knowledge_bound_run_preserves_snapshot_and_manifest_provenance
  - trace_manifest_knowledge_context_must_match_run_knowledge_provenance
  - protocol_version_is_fixed_for_run_unless_explicit_migration_occurs
  - policy_snapshot_is_fixed_for_run_unless_explicit_migration_occurs
  - material_authority_decisions_must_match_run_policy_snapshot_ref_and_hash
  - material_failures_are_not_overwritten
  - retry_identity_is_distinct
  - missing_authority_cannot_be_interpreted_as_allow
  - completed_state_requires_declared_completion_criteria
  - terminal_run_with_material_events_requires_persisted_trace_manifest
  - trace_manifest_run_task_trace_context_must_match_run_record
  - trace_manifest_hash_must_verify_before_acceptance
  - knowledge_context_does_not_grant_runtime_authority

validation_stage:
  current: deterministic_reference_validation
  runtime_validator: px00_profile_registry_kernel_trace_staffing_routing_and_knowledge_snapshot_tests
  library_dependency: none
