name: PX00 Contract Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Show runtime
        run: |
          python --version
          python -m pip --version

      - name: Install pinned validator dependency
        run: python -m pip install --no-input -r requirements-validator.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit and repository integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate PX00 repository contracts
        run: python -m px00 .
