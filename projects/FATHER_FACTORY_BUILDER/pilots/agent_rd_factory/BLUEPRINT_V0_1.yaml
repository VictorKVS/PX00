system_boundaries:
  - boundary_id: RD-BOUNDARY-001
    rule: prototype execution is limited to synthetic or public-safe environments
  - boundary_id: RD-BOUNDARY-002
    rule: external effects require separate PX00 ActionRequest AuthorityDecision CapabilityGrant and Tool Boundary
  - boundary_id: RD-BOUNDARY-003
    rule: Factory Builder blueprint never embeds credentials grants or live production secrets

trust_boundaries:
  - boundary_id: RD-TRUST-001
    from: external_research_content
    to: governed_knowledge
    rule: provenance and admission required; retrieved or generated text is not authoritative by itself
  - boundary_id: RD-TRUST-002
    from: specialist_output
    to: acceptance
    rule: material producer claim requires independent verification or explicit unproven status
  - boundary_id: RD-TRUST-003
    from: context
    to: material_action
    rule: tainted or untrusted context cannot directly authorize sensitive action

