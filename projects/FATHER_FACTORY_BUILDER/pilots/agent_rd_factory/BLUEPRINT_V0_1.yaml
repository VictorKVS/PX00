assumptions:
  - M1 execution may use replaceable model-backed agents
  - no production persistence is implied by reference stores
  - first pilot uses no autonomous procurement or physical control

residual_risks:
  - RISK-0002 remains critical until adversarial trust gate is proven end-to-end
  - reference persistence and concurrency controls remain below pilot-grade maturity
  - exact executor snapshot remains incomplete for future replay-grade comparisons

maturity_limits:
  - M1 prototype only
  - no live confidential customer data
  - no autonomous material external effect
  - no claim of production readiness
  - no transition to M3 while unresolved S3 risks remain above maturity threshold
  - any unresolved S4 blocks the affected maturity path

review_requirements:
  - independent Socrates review
  - ARGUS audit
  - Principal Software Engineer implementability review
  - Quality and Assurance acceptance review
  - Security and Risk maturity gate

invariants:
  - management_role_does_not_do_specialist_work
  - producer_and_independent_verifier_assignments_must_differ
  - role_and_capability_identity_do_not_depend_on_model_vendor
  - blueprint_does_not_grant_runtime_authority
  - specialist_dissent_is_preserved
  - revisions_create_new_blueprint_version
