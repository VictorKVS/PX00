schema_version: 0.1
status: draft
object_type: capability
project_ref: PROJECT-FFB-0001
purpose: define what a factory must be able to achieve independently of the current executor model vendor tool or device

required_fields:
  capability_id: {type: stable_id}
  canonical_name: {type: text}
  outcome_definition: {type: text}
  input_classes: {type: list}
  output_classes: {type: list}
  quality_attributes: {type: list}
  acceptance_criteria_refs: {type: list}
  dependency_capability_refs: {type: list}
  required_knowledge_space_refs: {type: list}
  minimum_maturity: {type: enum, values: [M0_CONCEPT, M1_PROTOTYPE, M2_INTEGRATED_PROTOTYPE, M3_CONTROLLED_PILOT, M4_PRE_PRODUCTION, M5_PRODUCTION]}
  criticality: {type: enum, values: [LOW, MEDIUM, HIGH, CRITICAL]}
  version: {type: string}

optional_fields:
  candidate_role_refs: {type: list}
  candidate_executor_classes: {type: list}
  resource_requirements: {type: list}
  safety_constraints: {type: list}
  security_constraints: {type: list}
  regulatory_constraints: {type: list}
  bottleneck_notes: {type: list}
  fallback_capability_refs: {type: list}

invariants:
  - capability_identity_is_independent_of_model_vendor_tool_device_or_role_assignment
  - capability_definition_describes_outcome_not_implementation_brand
  - dependencies_are_explicit
  - critical_capability_requires_measurable_acceptance
  - knowledge_access_does_not_grant_capability_authority
  - candidate_executor_is_replaceable_without_changing_capability_identity
  - capability_does_not_grant_runtime_authority
  - revisions_supersede_instead_of_rewriting_history

lifecycle:
  - PROPOSED
  - REVIEWED
  - APPROVED
  - ACTIVE
  - DEPRECATED
  - SUPERSEDED
