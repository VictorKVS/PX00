independent_controls:
  - SOCRATES and ARGUS are not subordinate approval functions of FFB-ROLE-0001
  - critical review assignments must be organizationally separate from producer assignments
  - Quality independent verification cannot be performed by the same assignment that produced the critical artifact
  - owner override is allowed only as explicit governed decision and cannot delete dissent risk or failed evidence

operating_principles:
  - capability_decomposition_precedes_role_or_executor_selection
  - architecture_synthesis_occurs_after_specialist_inputs
  - implementation_must_not_silently_rewrite_contract
  - dissent_is_preserved
  - role_creation_requires_stable_responsibility
  - knowledge_access_does_not_grant_authority
  - factory_blueprint_does_not_grant_runtime_execution_authority
  - quality_PASS_requires_declared_criteria_and_evidence
