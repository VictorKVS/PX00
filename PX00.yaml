product_id: PX-00
repository: VictorKVS/PX00
package_namespace: px00
architecture_codename: FATHER
status: architecture-baseline
baseline_version: 0.1

identity_policy:
  canonical_identity_mutable: false
  display_brand_mutable: true
  customer_brand_is_canonical: false

architecture_policy:
  global_core: true
  regionalization: policy_profiles
  customer_customization: controlled_profiles_and_extensions
  uncontrolled_source_forks: prohibited

assurance_policy:
  llm_output_is_evidence: false
  provenance_required_for_material_knowledge: true
  traceability_required_for_material_decisions: true
  explicit_authority_required_for_autonomous_actions: true
  material_decision_pre_and_post_evaluation: true
  material_pass_requires_declared_criteria_and_evidence: true

development_evidence:
  journal: DEVELOPMENT_JOURNAL.md
  structure_history: Tree_F
  material_structure_change_record_required: true
  file_dossier_required_for_material_changes: true
  comparative_evaluation_enabled: true
  experiment_variants_supported: true
  lifecycle_decisions:
    - KEEP
    - IMPROVE
    - REPLACE
    - ROLLBACK
    - EXPERIMENT
  sensitive_evidence_in_public_repo: prohibited

baseline_contracts:
  canonical_object_model: architecture/CANONICAL_OBJECT_MODEL.md
  canonical_object_envelope: schemas/CANONICAL_OBJECT_ENVELOPE.yaml
  role_package_contract: roles/ROLE_PACKAGE_CONTRACT.md
  role_template: roles/ROLE_TEMPLATE.yaml
  authority_autonomy_contract: governance/AUTHORITY_AUTONOMY_CONTRACT.md
  authority_decision_schema: schemas/AUTHORITY_DECISION.yaml
  event_trace_provenance_contract: architecture/EVENT_TRACE_PROVENANCE_CONTRACT.md
  event_envelope_schema: schemas/EVENT_ENVELOPE.yaml
  trace_manifest_schema: schemas/TRACE_MANIFEST.yaml
  knowledge_admission_contract: knowledge/KNOWLEDGE_ADMISSION_CONTRACT.md
  knowledge_record_schema: schemas/KNOWLEDGE_RECORD.yaml
  decision_evaluation_contract: assurance/DECISION_EVALUATION_CONTRACT.md
  decision_record_schema: schemas/DECISION_RECORD.yaml
  evaluation_record_schema: schemas/EVALUATION_RECORD.yaml
  protocol_execution_contract: protocols/PROTOCOL_EXECUTION_CONTRACT.md
  protocol_definition_schema: schemas/PROTOCOL_DEFINITION.yaml
  run_record_schema: schemas/RUN_RECORD.yaml
  acceptance_model: assurance/ACCEPTANCE_MODEL.md
  acceptance_record_schema: schemas/ACCEPTANCE_RECORD.yaml
  latest_contract_decision: architecture/adr/ADR-0015-minimal-local-contract-validator.md

pilot_roles:
  ROLE-0201:
    canonical_name: analyst
    path: roles/ROLE-0201-analyst
    protocol: PROTO-0201
    autonomy_cap: A1
    acceptance: PASS_WITH_ACTIONS_CONTRACT_LEVEL
  ROLE-0202:
    canonical_name: critical_reviewer
    display_name: Socrates
    path: roles/ROLE-0202-critical-reviewer
    protocol: PROTO-0202
    autonomy_cap: A1
    acceptance: PASS_WITH_ACTIONS_CONTRACT_LEVEL

pilot_acceptance:
  fixture: assurance/fixtures/PILOT-0001_ANALYST_SOCRATES_ACCEPTANCE.yaml
  dry_run: assurance/runs/PILOT-0001_DRY_RUN_2026-08-11.md
  record: assurance/records/ACCEPTANCE-PILOT-0001.yaml
  state: PASS_WITH_ACTIONS
  production_use_allowed: false

runtime_gate:
  code_allowed: true
  scope: minimal_local_contract_validation_only
  production_runtime_allowed: false
  allowed:
    - local_contract_validator
    - local_fixture_runner
    - synthetic_public_safe_test_data
    - deterministic_reference_checks
    - acceptance_evidence_generation
  prohibited:
    - production_agents
    - live_customer_or_protected_data
    - network_side_effects
    - autonomous_material_actions_above_A1
    - broad_orchestration_framework
    - live_knowledge_admission_from_model_output

minimal_validator:
  package: px00
  entry_point: python -m px00 .
  validator: px00/validator.py
  dependency_file: requirements-validator.txt
  direct_dependencies:
    PyYAML: 6.0.3
  tests: tests/test_validator.py
  integration_test: RepositoryIntegrationTests.test_current_repository_contracts
  test_framework: python_stdlib_unittest
  devsecops_baseline: security/DEVSECOPS_BASELINE_0_1.md
  structural_records:
    - Tree_F/TF-0009_2026-08-12_MINIMAL_CONTRACT_VALIDATOR.md
    - Tree_F/TF-0010_2026-08-12_REAL_REPOSITORY_INTEGRATION_GATE.md
    - Tree_F/TF-0011_2026-08-12_REAL_LOCAL_VALIDATION_PASS.md
  architecture_decision: architecture/adr/ADR-0015-minimal-local-contract-validator.md
  network_required: false
  external_side_effects: false
  authoring_unit_tests:
    count: 12
    state: PASS
  real_local_repository_validation:
    state: PASS
    tests: 13
    errors: 0
    warnings: 0
    run: assurance/runs/VALIDATOR-0002_REAL_LOCAL_RUN_2026-08-12.md
    acceptance: assurance/records/ACCEPTANCE-VALIDATOR-0001.yaml
  environment_reproducibility:
    state: PASS_WITH_ACTIONS
    observed_issue: shared_host_python_environment_contains_unrelated_dependency_conflict
    required_next_control: isolated_dot_venv

current_phase:
  name: Architecture Baseline 0.1 - Executable Validation Gate
  completed_gates:
    - canonical_identity
    - governance_constitution
    - architecture_adr_0001_0015
    - development_evidence_corpus
    - canonical_object_model
    - governed_role_package_contract
    - authority_autonomy_contract
    - event_trace_provenance_contract
    - knowledge_admission_contract
    - decision_evaluation_contract
    - protocol_execution_contract
    - acceptance_model
    - analyst_role_package_pilot
    - critical_reviewer_role_package_pilot
    - pilot_protocols
    - pilot_acceptance_fixture_definition
    - pilot_0001_contract_dry_run
    - pilot_0001_acceptance_record
    - minimal_runtime_opening
    - minimal_machine_validation_representation_selected
    - local_contract_validator_implemented
    - synthetic_negative_tests_added
    - direct_dependency_recorded_and_pinned
    - real_repository_integration_test_defined
    - real_local_repository_validation_passed
    - validator_acceptance_recorded
  next_gate:
    - reproduce_validator_in_isolated_dot_venv
    - preserve_isolated_environment_evidence
    - add_minimal_ci_if_isolated_gate_is_stable
    - verify_repository_secret_scanning_and_branch_protection
    - add_dependency_sbom_automation_before_releasable_distribution
  exit_gate: executable_contract_validation_passes_in_isolated_local_and_minimal_ci_environments_without_broad_runtime_or_external_side_effects
